version: 2
updates:
  # Python dependencies.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["security", "devops"]
    commit-message:
      prefix: "chore(deps)"

  # GitHub Actions versions.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["devops"]
    commit-message:
      prefix: "chore(ci)"
