[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-aerial"
version = "0.1.0"
description = "AI Aerial Surveillance & Response System — a software-only surveillance brain for closed WiFi FPV toy drones."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["surveillance", "computer-vision", "drone", "opencv", "yolo", "fastapi"]

dependencies = [
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "mss>=9.0.1",
]

[project.optional-dependencies]
# Installed incrementally as later phases land.
ai = ["ultralytics>=8.1.0"]
dashboard = ["fastapi>=0.110.0", "uvicorn>=0.29.0", "websockets>=12.0"]
alert = ["requests>=2.31.0"]
full = [
    "ultralytics>=8.1.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "websockets>=12.0",
    "requests>=2.31.0",
]
# Test suite deps. Deliberately excludes torch/ultralytics — tests use pure
# helpers and fakes for the detector, so they run fast without model weights.
test = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "mss>=9.0.1",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "httpx>=0.27",
    "requests>=2.31.0",
]

[project.scripts]
sentinel = "sentinel.cli:main"

[tool.setuptools.packages.find]
include = ["sentinel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["sentinel"]
omit = ["sentinel/__main__.py"]

[tool.ruff]
target-version = "py39"
line-length = 88

[tool.ruff.lint]
# Pin to ruff's default ruleset (E4/E7/E9 + pyflakes) so CI is deterministic
# across ruff releases. Broaden to import-sorting/bugbear later under its own
# issue once the tree is confirmed clean against them.
select = ["E4", "E7", "E9", "F"]
