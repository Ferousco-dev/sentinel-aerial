[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-aerial"
version = "0.1.0"
description = "AI Aerial Surveillance & Response System — a software-only surveillance brain for closed WiFi FPV toy drones."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["surveillance", "computer-vision", "drone", "opencv", "yolo", "fastapi"]

dependencies = [
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "mss>=9.0.1",
]

[project.optional-dependencies]
# Installed incrementally as later phases land.
ai = ["ultralytics>=8.1.0"]
dashboard = ["fastapi>=0.110.0", "uvicorn>=0.29.0", "websockets>=12.0"]
alert = ["requests>=2.31.0"]
full = [
    "ultralytics>=8.1.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "websockets>=12.0",
    "requests>=2.31.0",
]

[project.scripts]
sentinel = "sentinel.cli:main"

[tool.setuptools.packages.find]
include = ["sentinel*"]
